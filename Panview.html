<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Binge Leisure | 360° Studio Gallery — Immersive Art experience</title>
    
    <!-- Google Fonts + Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-glow: #BC8A5F;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: #03050a;
            overflow-x: hidden;
            color: #fff;
        }
        
        /* Header Glass premium */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 18px 0;
            background: rgba(10, 12, 18, 0.75);
            backdrop-filter: blur(16px);
            z-index: 1100;
            border-bottom: 1px solid rgba(188,138,95,0.5);
            box-shadow: 0 4px 25px rgba(0,0,0,0.3);
        }
        
        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 30px;
            font-weight: 700;
            background: linear-gradient(135deg, #BC8A5F, #EBD6B0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
        }
        .logo i {
            color: #BC8A5F;
            margin-right: 10px;
            font-size: 28px;
        }
        
        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }
        .nav-links a {
            text-decoration: none;
            color: #e0dcd5;
            font-weight: 500;
            transition: 0.3s;
        }
        .nav-links a:hover {
            color: #BC8A5F;
            text-shadow: 0 0 5px rgba(188,138,95,0.5);
        }
        .btn-studio {
            background: linear-gradient(145deg, #BC8A5F, #9B6E48);
            border: none;
            color: white;
            padding: 8px 26px;
            border-radius: 40px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 2px 12px rgba(188,138,95,0.5);
        }
        .btn-studio:hover {
            transform: scale(1.02);
            background: linear-gradient(145deg, #D4A373, #BC8A5F);
        }
        
        /* Main 3D Canvas */
        .studio-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #020308;
        }
        
        #three-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* UI */
        .gallery-ui {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            z-index: 200;
            text-align: center;
            pointer-events: none;
        }
        
        .control-bar {
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(12px);
            display: inline-flex;
            gap: 25px;
            padding: 10px 28px;
            border-radius: 60px;
            border: 1px solid rgba(188,138,95,0.6);
            pointer-events: auto;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        
        .scene-badge {
            position: absolute;
            bottom: 28%;
            left: 28px;
            background: linear-gradient(115deg, rgba(0,0,0,0.65), rgba(61,90,91,0.5));
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-left: 5px solid #BC8A5F;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            z-index: 210;
            pointer-events: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        
        .counter {
            position: absolute;
            top: 100px;
            right: 25px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-family: monospace;
            letter-spacing: 1px;
            border-right: 2px solid #BC8A5F;
        }
        
        .auto-btn {
            position: absolute;
            bottom: 110px;
            right: 25px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border: 1px solid #BC8A5F;
            border-radius: 50px;
            padding: 10px 20px;
            cursor: pointer;
            z-index: 220;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: 0.2s;
            pointer-events: auto;
        }
        
        .auto-btn:hover {
            background: #BC8A5F;
            color: #111;
            box-shadow: 0 0 10px #BC8A5F;
        }
        
        .footer-hint {
            position: absolute;
            bottom: 18px;
            left: 20px;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0f1a, #020308);
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 1s ease;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(188,138,95,0.2);
            border-top: 3px solid #BC8A5F;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .loader-text {
            font-size: 1.3rem;
            background: linear-gradient(45deg, #BC8A5F, #E4C7A2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .control-bar { padding: 6px 16px; gap: 12px; font-size: 0.7rem; }
            .scene-badge { font-size: 0.75rem; padding: 8px 16px; bottom: 22%; }
            .auto-btn { bottom: 85px; right: 15px; padding: 6px 14px; }
        }
    </style>
</head>
<body>

<header>
    <div class="container d-flex justify-content-between align-items-center" style="max-width: 1400px; margin: 0 auto; padding: 0 24px;">
        <a href="#" class="logo"><i class="fas fa-crown"></i>Binge<span>Leisure</span></a>
        <ul class="nav-links">
            <li><a href="indexmaps.html">Home</a></li>
            <li><a href="aboutus.html">About</a></li>
            <li><a href="luxurysignup.html">Exclusive</a></li>
            <li><a href="Bookings.html">Reservations</a></li>
            <li><a href="Panview.html" style="color: #BC8A5F;">360° Studio</a></li>
        </ul>
        <div><a href="#" class="btn-studio"><i class="fas fa-gem"></i> Visit</a></div>
    </div>
</header>

<div class="studio-container">
    <div id="three-canvas"></div>
    <div class="counter"><i class="fas fa-images"></i> <span id="currentIdx">1</span> / <span id="totalCount">6</span></div>
    <div class="gallery-ui">
        <div class="control-bar">
            <span><i class="fas fa-mouse-pointer"></i> Drag 360°</span>
            <span><i class="fas fa-search-plus"></i> Zoom</span>
            <span><i class="fas fa-sync-alt"></i> Auto-Rotate</span>
        </div>
    </div>
    <div class="scene-badge" id="dynamicLabel">
        <i class="fas fa-arrow-up"></i> Raised Dining • Studio Edition
    </div>
    <div class="auto-btn" id="autoRotateBtn">
        <i class="fas fa-play-circle"></i> <span id="autoText">AUTO ON</span>
    </div>
    <div class="footer-hint">
        <i class="fas fa-vr-cardboard"></i> Studio Gallery | Premium Visuals
    </div>
</div>

<div id="loadingScreen" class="loading-screen">
    <div class="loader"></div>
    <div class="loader-text">Loading Immersive Studio Gallery</div>
    <p style="margin-top: 12px; color:#BC8A5F;">Binge Leisure — Art of Luxury</p>
</div>

<!-- Import Maps -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    
    // Resort images (from homepage source)
    const galleryImages = [
        { url: "IMG-20260126-WA0012.jpg", title: "40ft Raised Dining", desc: "Treetop Culinary", icon: "fa-arrow-up", accent: "#E6B17E" },
        { url: "IMG-20260126-WA0013.jpg", title: "Natural Dam", desc: "Private Marina", icon: "fa-water", accent: "#6ba3b0" },
        { url: "IMG-20260126-WA0014.jpg", title: "Curated Performances", desc: "Starlit Stage", icon: "fa-theater-masks", accent: "#C779D0" },
        { url: "IMG-20260126-WA0015.jpg", title: "Treetop Villa", desc: "Canopy Retreat", icon: "fa-tree", accent: "#8FBC8F" },
        { url: "IMG-20260126-WA0022.jpg", title: "Waterfront Suite", desc: "Infinity Views", icon: "fa-swimmer", accent: "#48D1CC" },
        { url: "IMG-20260126-WA0023.jpg", title: "Executive Residence", desc: "VIP Sanctuary", icon: "fa-gem", accent: "#DAA520" }
    ];
    
    // Setup scene
    const container = document.getElementById('three-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x01020a);
    scene.fog = new THREE.FogExp2(0x01020a, 0.012);
    
    // Camera position to fit larger images closer arrangement
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.4, 4.2);
    camera.lookAt(0, 1.1, 0);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);
    
    // CSS2 Renderer for labels
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    container.appendChild(labelRenderer.domElement);
    
    // Controls with auto-rotate (studio style)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableZoom = true;
    controls.zoomSpeed = 0.9;
    controls.rotateSpeed = 1.4;
    controls.enablePan = false;
    controls.target.set(0, 1.1, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.4;
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    
    // Auto-rotate toggle
    let autoActive = true;
    const autoBtn = document.getElementById('autoRotateBtn');
    const autoSpan = document.getElementById('autoText');
    autoBtn.addEventListener('click', () => {
        controls.autoRotate = !controls.autoRotate;
        autoActive = controls.autoRotate;
        autoSpan.innerText = autoActive ? "AUTO ON" : "AUTO OFF";
        autoBtn.style.background = autoActive ? "#BC8A5F" : "rgba(0,0,0,0.7)";
        autoBtn.style.color = autoActive ? "#111" : "#fff";
    });
    
    // ----- STUDIO ENVIRONMENT: Reflective glossy floor + backdrop + professional lighting -----
    // Mirrored floor (semi-reflective)
    const planeMat = new THREE.MeshStandardMaterial({ color: 0x10141f, roughness: 0.28, metalness: 0.85, emissive: 0x000000 });
    const floorPlane = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), planeMat);
    floorPlane.rotation.x = -Math.PI / 2;
    floorPlane.position.y = -0.6;
    floorPlane.receiveShadow = true;
    scene.add(floorPlane);
    
    // Circular glossy pedestal stage
    const stageMat = new THREE.MeshStandardMaterial({ color: 0x1a1e2a, metalness: 0.7, roughness: 0.3, emissive: 0x0a0a12 });
    const stageDisc = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 0.08, 64), stageMat);
    stageDisc.position.y = -0.55;
    stageDisc.receiveShadow = true;
    stageDisc.castShadow = true;
    scene.add(stageDisc);
    
    // Outer ring (studio rim)
    const rimMat = new THREE.MeshStandardMaterial({ color: 0xBC8A5F, metalness: 0.9, emissive: 0x3a2a1a });
    const rimRing = new THREE.Mesh(new THREE.TorusGeometry(3.35, 0.06, 64, 200), rimMat);
    rimRing.rotation.x = Math.PI / 2;
    rimRing.position.y = -0.5;
    scene.add(rimRing);
    
    // Background curved subtle gradient via large sphere (interior studio feel)
    const bgTexture = (() => {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, '#080c1a');
        grad.addColorStop(0.6, '#141b2b');
        grad.addColorStop(1, '#2a2a3a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return new THREE.CanvasTexture(canvas);
    })();
    const backdropSphere = new THREE.Mesh(new THREE.SphereGeometry(14, 32, 32), new THREE.MeshStandardMaterial({ map: bgTexture, side: THREE.BackSide, roughness: 0.5 }));
    scene.add(backdropSphere);
    
    // Studio lighting: Key light + fill + rim lights
    const keyLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    keyLight.position.set(2, 3, 2);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    scene.add(keyLight);
    
    const fillLight = new THREE.PointLight(0xBC8A5F, 0.5);
    fillLight.position.set(-1, 1.8, 2);
    scene.add(fillLight);
    
    const rimLight1 = new THREE.PointLight(0xD4AF37, 0.7);
    rimLight1.position.set(2, 1.5, -2.5);
    scene.add(rimLight1);
    
    const rimLight2 = new THREE.PointLight(0x6FA8DC, 0.6);
    rimLight2.position.set(-2, 1.5, -2.8);
    scene.add(rimLight2);
    
    const accentLight = new THREE.PointLight(0xBC8A5F, 0.45);
    accentLight.position.set(0, 0.5, 2.2);
    scene.add(accentLight);
    
    // Ambient with subtle color change (dynamic)
    const ambient = new THREE.AmbientLight(0x22223b, 0.55);
    scene.add(ambient);
    
    // Decorative particles (floating dust)
    const dustCount = 1400;
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount; i++) {
        dustPos[i*3] = (Math.random() - 0.5) * 7;
        dustPos[i*3+1] = (Math.random() - 0.5) * 3 + 0.2;
        dustPos[i*3+2] = (Math.random() - 0.5) * 8 - 2;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dustMat = new THREE.PointsMaterial({ color: 0xBC8A5F, size: 0.025, transparent: true, blending: THREE.AdditiveBlending });
    const dustPoints = new THREE.Points(dustGeo, dustMat);
    scene.add(dustPoints);
    
    // ---------- IMAGE DISPLAY (larger, closer to each other) ----------
    // reduce radius from 3.3 -> 2.2 (makes images closer together)
    const radius = 2.25;
    const yBase = 0.95;
    const angles = [0, 60, 120, 180, 240, 300].map(deg => deg * Math.PI / 180);
    const imagePlanes = [];
    let loadedCount = 0;
    const totalImages = galleryImages.length;
    const textureLoader = new THREE.TextureLoader();
    
    function assetLoaded() {
        loadedCount++;
        if (loadedCount === totalImages) {
            const loaderDiv = document.getElementById('loadingScreen');
            gsap.to(loaderDiv, { opacity: 0, duration: 0.8, delay: 0.3, onComplete: () => loaderDiv.style.display = 'none' });
        }
    }
    
    // larger plane dimensions: width 2.8, height 2.1 (more prominent)
    const planeWidth = 2.8;
    const planeHeight = 2.1;
    
    galleryImages.forEach((img, idx) => {
        const angle = angles[idx];
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        
        const texture = textureLoader.load(img.url, assetLoaded, undefined, (err) => { console.warn(err); assetLoaded(); });
        texture.colorSpace = THREE.SRGBColorSpace;
        const material = new THREE.MeshStandardMaterial({ map: texture, side: THREE.DoubleSide, roughness: 0.22, metalness: 0.08, emissive: 0x331a0a, emissiveIntensity: 0.08 });
        const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
        const plane = new THREE.Mesh(geometry, material);
        plane.position.set(x, yBase + (idx % 2 === 0 ? 0.08 : -0.03), z);
        plane.lookAt(0, yBase, 0);
        plane.userData = { title: img.title, desc: img.desc, idx: idx, icon: img.icon };
        plane.castShadow = true;
        plane.receiveShadow = false;
        scene.add(plane);
        
        // Elegant golden frame edge
        const edgesGeo = new THREE.EdgesGeometry(geometry);
        const frameMat = new THREE.LineBasicMaterial({ color: 0xBC8A5F });
        const wireframe = new THREE.LineSegments(edgesGeo, frameMat);
        plane.add(wireframe);
        
        // CSS2D Label (positioned slightly below each panel)
        const div = document.createElement('div');
        div.style.background = 'linear-gradient(95deg, rgba(0,0,0,0.7), rgba(61,90,91,0.6))';
        div.style.backdropFilter = 'blur(8px)';
        div.style.padding = '6px 16px';
        div.style.borderRadius = '40px';
        div.style.border = `1px solid ${img.accent || '#BC8A5F'}`;
        div.style.fontSize = '12px';
        div.style.fontWeight = 'bold';
        div.style.color = '#f5ead6';
        div.innerHTML = `<i class="fas ${img.icon}" style="color:#BC8A5F; margin-right:6px;"></i>${img.title}`;
        const labelObj = new CSS2DObject(div);
        labelObj.position.set(x, yBase - 1.25, z);
        scene.add(labelObj);
        
        imagePlanes.push(plane);
    });
    
    // Additional gallery accents: floating spotlights around each image
    const spotGroup = [];
    for (let i = 0; i < 6; i++) {
        const ang = angles[i];
        const xSpot = Math.cos(ang) * (radius + 0.4);
        const zSpot = Math.sin(ang) * (radius + 0.4);
        const spotLight = new THREE.PointLight(0xBC8A5F, 0.4);
        spotLight.position.set(xSpot, yBase + 0.4, zSpot);
        scene.add(spotLight);
        spotGroup.push(spotLight);
    }
    
    // Central crystal pedestal (interactive)
    const crystalMat = new THREE.MeshStandardMaterial({ color: 0xBC8A5F, emissive: 0x3a2a1a, metalness: 0.9, roughness: 0.2 });
    const centerCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 0.5, 16), crystalMat);
    centerCyl.position.set(0, -0.35, 0);
    centerCyl.castShadow = true;
    scene.add(centerCyl);
    
    const centerOrb = new THREE.Mesh(new THREE.SphereGeometry(0.19, 24, 24), crystalMat);
    centerOrb.position.set(0, -0.05, 0);
    scene.add(centerOrb);
    
    // Dynamic color & lighting animation (studio vibe)
    let t = 0;
    function animateColors() {
        requestAnimationFrame(animateColors);
        t += 0.012;
        
        // subtle shifting of studio lights
        const hue = (t * 0.08) % 1;
        fillLight.intensity = 0.55 + Math.sin(t * 0.9) * 0.15;
        rimLight1.intensity = 0.65 + Math.cos(t * 0.7) * 0.12;
        accentLight.intensity = 0.5 + Math.sin(t * 1.2) * 0.1;
        keyLight.intensity = 1.1 + Math.sin(t * 0.5) * 0.1;
        
        // rotating accents on image spots
        spotGroup.forEach((light, i) => {
            light.intensity = 0.35 + Math.sin(t * 1.5 + i) * 0.15;
        });
        
        // Crystal orb pulse
        const pulse = 0.55 + Math.sin(t * 2.2) * 0.12;
        centerOrb.material.emissiveIntensity = pulse;
        centerCyl.material.emissiveIntensity = pulse * 0.6;
        
        // Dust particles drifting
        dustPoints.rotation.y += 0.002;
        
        // rotating stage ring
        rimRing.rotation.z += 0.003;
        
        // Update current focused image label
        let bestIdx = 0;
        let maxDot = -Infinity;
        const camDir = controls.target.clone().sub(camera.position).normalize();
        imagePlanes.forEach((plane, i) => {
            const toPlane = plane.position.clone().sub(camera.position).normalize();
            const dot = camDir.dot(toPlane);
            if (dot > maxDot) {
                maxDot = dot;
                bestIdx = i;
            }
        });
        const activeImg = galleryImages[bestIdx];
        if (activeImg) {
            document.getElementById('dynamicLabel').innerHTML = `<i class="fas ${activeImg.icon}" style="color:${activeImg.accent}"></i> ${activeImg.title} <span style="font-size:0.8rem;">• ${activeImg.desc}</span>`;
            document.getElementById('currentIdx').innerText = bestIdx + 1;
        }
    }
    animateColors();
    
    // Hover interaction (scale up slightly)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredImage = null;
    window.addEventListener('mousemove', (event) => {
        mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
        mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(imagePlanes);
        if (intersects.length) {
            const hit = intersects[0].object;
            if (hoveredImage !== hit) {
                if (hoveredImage) hoveredImage.scale.set(1, 1, 1);
                hoveredImage = hit;
                hoveredImage.scale.set(1.045, 1.045, 1);
                document.body.style.cursor = 'grab';
            }
        } else {
            if (hoveredImage) {
                hoveredImage.scale.set(1, 1, 1);
                hoveredImage = null;
                document.body.style.cursor = 'default';
            }
        }
    });
    
    // Set total image count
    document.getElementById('totalCount').innerText = galleryImages.length;
    
    // Rendering loop
    function renderLoop() {
        requestAnimationFrame(renderLoop);
        controls.update(); // auto-rotate handled
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
    }
    renderLoop();
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // Fallback hide loader after max 4 secs
    setTimeout(() => {
        const loadScr = document.getElementById('loadingScreen');
        if (loadScr.style.display !== 'none') loadScr.style.display = 'none';
    }, 4000);
    
    // GSAP import for fade (lightweight)
    import('https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js').then(gsapMod => {
        window.gsap = gsapMod.default || gsapMod;
    });
</script>
